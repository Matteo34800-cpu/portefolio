<div class="split-bg">
  <div class="split split-info" [style.width.%]="100 - sliderValue"></div>
  <div class="split split-escalade" [style.width.%]="sliderValue"></div>
</div>

<div class="split-content">
  <div class="labels">
    <span [class.active]="selectedCategory === 'info'">Projet professionnel</span>
    <input type="range" min="0" max="100" [value]="sliderValue" (input)="onSliderInput($event)"
      (change)="onSliderChange($event)" class="slider" />
    <span [class.active]="selectedCategory === 'escalade'">Projet personnel</span>
  </div>
  <div class="content-wrapper">
    @if(selectedCategory === 'info') {
    <div class="content info">
      <h2>Ma vie dans l'Informatique</h2>
      <div class="bio-container">
        <p class="textDescription">{{ bioInfo }}</p>
        <img src="assets/images/randoMonsChloe.jpg" alt="" class="programming-image" loading="lazy">
      </div>
    </div>
    }
    @else {
    <div class="content escalade" >
      <img
        src="assets/images/245208442-vector-illustration-of-a-man-climbing-on-a-cliff-climbing-concept-removebg-preview.svg"
        alt="" class="climbing-image" loading="lazy">
      <h2>Ma vie dans l'Escalade</h2>
      <div class="bio-container">
        <p class="textDescription">{{ bioEscalade }}</p>
        <img src="assets/images/Occitecnikportraitgorges.jpg" alt="" class="programming-image">
      </div>
    </div>
    }
  </div>
</div>
